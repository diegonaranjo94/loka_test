AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Loka data engineering test - MCP side project, stack 2 of 2.
  Read-only MCP server over the gold layer: Lambda (container image) behind a
  public Function URL, with an application-level URL token kept in Secrets
  Manager. Phase 1.1 - no alarms/budget here (phase 1.2), no OAuth (phase 2).

Parameters:
  ProjectName:
    Type: String
    Default: loka-test-mcp
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,40}$"
    Description: Must match the value used for the ECR stack.

  ImageTag:
    Type: String
    AllowedPattern: "^[A-Za-z0-9._-]{1,128}$"
    Description: Tag pushed to the ECR repo (the deploy script uses the git sha).

  DataBucketName:
    Type: String
    Description: Pipeline output bucket (loka-test-poc-<acct>-us-east-1). Passed in, not imported, so this stack never takes a dependency on the data stack.

  GoldPrefix:
    Type: String
    Default: gold/
    AllowedPattern: "^[A-Za-z0-9._/-]+/$"
    Description: Only prefix the function may read. Must end with "/".

  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: Must match the platform the image was built for.

  MemorySize:
    Type: Number
    Default: 1024
    MinValue: 512
    MaxValue: 10240
    Description: DuckDB is memory-hungry, and Lambda CPU scales with memory.

  TimeoutSeconds:
    Type: Number
    Default: 60
    MinValue: 10
    MaxValue: 900

  ReservedConcurrency:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 50
    Description: Hard ceiling on parallel executions - the free cost/abuse guard for a public endpoint.

  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

Resources:
  # ---------------------------------------------------------------- auth token
  # Phase-1 auth: the server only answers on /<token>/mcp. CloudFormation
  # generates the value, so it never exists in git, a parameter, or a shell
  # history. URL-safe alphabet because it travels in the path.
  UrlToken:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/url-token"
      Description: Path token required by the MCP server (phase 1, replaced by OAuth in phase 2).
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
        IncludeSpace: false
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Purpose, Value: mcp-side-project }
        - { Key: ManagedBy, Value: cloudformation }

  # ------------------------------------------------------------------ logging
  # Declared explicitly: the log group Lambda creates on its own keeps logs
  # forever and is not owned by any stack.
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-server"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Purpose, Value: mcp-side-project }
        - { Key: ManagedBy, Value: cloudformation }

  # ------------------------------------------------------------- permissions
  # Least privilege: gold only, read only. Bronze, silver and _quarantine are
  # unreachable even if the SQL guard in the app were bypassed.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub "Execution role for ${ProjectName}-server (read-only on ${GoldPrefix})"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${LogGroup.Arn}:*"
        - PolicyName: gold-read-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListGoldOnly
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${DataBucketName}"
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub "${GoldPrefix}*"
              - Sid: ReadGoldObjects
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${DataBucketName}/${GoldPrefix}*"
        - PolicyName: read-url-token
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref UrlToken
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Purpose, Value: mcp-side-project }
        - { Key: ManagedBy, Value: cloudformation }

  # ----------------------------------------------------------------- function
  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-server"
      Description: Read-only MCP server over the Loka test gold layer (DuckDB on S3 Parquet).
      PackageType: Image
      Code:
        ImageUri: !Sub
          - "${RepoUri}:${ImageTag}"
          - RepoUri:
              Fn::ImportValue: !Sub "${ProjectName}-ecr-repository-uri"
      Architectures:
        - !Ref Architecture
      MemorySize: !Ref MemorySize
      Timeout: !Ref TimeoutSeconds
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Role: !GetAtt ExecutionRole.Arn
      LoggingConfig:
        LogGroup: !Ref LogGroup
        LogFormat: JSON
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucketName
          GOLD_PREFIX: !Ref GoldPrefix
          URL_TOKEN_SECRET_ARN: !Ref UrlToken
          # Lambda's filesystem is read-only except /tmp; DuckDB writes its
          # home/extension dir and spill files there.
          HOME: /tmp
          # AWS Lambda Web Adapter: proxy invocations to the ASGI server on
          # this port and wait for it to be ready before the first request.
          AWS_LWA_PORT: "8080"
          AWS_LWA_READINESS_CHECK_PATH: /healthz
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Purpose, Value: mcp-side-project }
        - { Key: ManagedBy, Value: cloudformation }

  # Public HTTPS endpoint. AuthType NONE because Claude's connector cannot
  # SigV4-sign requests; authentication happens in the app (URL token now,
  # OAuth in phase 2). BUFFERED: the server runs MCP in stateless JSON mode,
  # no long-lived streams.
  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Function
      AuthType: NONE
      InvokeMode: BUFFERED

  # Public Function URLs need both grants: one for the URL itself, one for the
  # underlying invoke, restricted to calls that arrive through the URL so the
  # function cannot be invoked directly by anyone.
  PublicUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  PublicInvokeViaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  FunctionName:
    Value: !Ref Function
  FunctionUrl:
    Description: Base URL. The connector URL is <FunctionUrl><token>/mcp - print it with the deploy script, never paste the token anywhere public.
    Value: !GetAtt FunctionUrl.FunctionUrl
  UrlTokenSecretArn:
    Value: !Ref UrlToken
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
  LogGroupName:
    Value: !Ref LogGroup
