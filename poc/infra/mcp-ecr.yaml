AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Loka data engineering test - MCP side project, stack 1 of 2.
  Container registry for the MCP server image. Deployed once, before the
  server stack, because a Lambda function cannot be created from an image
  that does not exist yet.

Parameters:
  ProjectName:
    Type: String
    Default: loka-test-mcp
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,40}$"
    Description: Prefix for every resource name in the MCP stacks.

  ImagesToKeep:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 50
    Description: Most recent images kept; older ones are expired by the lifecycle policy.

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-server"
      # Every deploy pushes a new, unique tag (git sha). Immutable tags mean the
      # tag the Lambda points at can never be silently overwritten underneath it,
      # so "which code is running" always has one answer.
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      # Images are build artefacts, rebuildable from git: let the stack delete
      # the repo even when it still holds images.
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged layers (failed or superseded pushes) after 1 day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep only the ${ImagesToKeep} most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": ${ImagesToKeep}
                },
                "action": { "type": "expire" }
              }
            ]
          }
      # Lambda pulls the image with its service principal, not the execution
      # role. Granting it here explicitly (scoped to this account's functions)
      # stops Lambda from patching the policy itself, which would show up as
      # drift on this stack.
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaImagePull
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringLike:
                aws:sourceArn: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:*"
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Purpose, Value: mcp-side-project }
        - { Key: ManagedBy, Value: cloudformation }

Outputs:
  RepositoryName:
    Value: !Ref Repository
    Export:
      Name: !Sub "${ProjectName}-ecr-repository-name"
  RepositoryUri:
    Description: Push target, e.g. <uri>:<git-sha>
    Value: !GetAtt Repository.RepositoryUri
    Export:
      Name: !Sub "${ProjectName}-ecr-repository-uri"
  RepositoryArn:
    Value: !GetAtt Repository.Arn
    Export:
      Name: !Sub "${ProjectName}-ecr-repository-arn"
