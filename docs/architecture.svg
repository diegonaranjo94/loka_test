<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1600" height="720" fill="#F4F5F3"/>

  <text x="24" y="34" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="21" fill="#1C2327">Wearable ETL Architecture</text>
  <text x="24" y="54" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="500" font-size="12" fill="#6B7580">Loka data engineering test — Bronze / Silver / Gold on S3, one command end to end</text>

  <g transform="translate(0,70)">
    <defs>
      <marker id="arrow-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
      </marker>
      <marker id="arrow-quarantine" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/>
      </marker>
      <marker id="arrow-dq" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#6B7580"/>
      </marker>
    </defs>

    <!-- ============ SOURCE ============ -->
    <text x="24" y="128" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#1C2327">SOURCE</text>

    <rect x="24" y="140" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#D7DBDD" stroke-width="1.5"/>
    <text x="40" y="164" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="600" font-size="12" fill="#1C2327">SOURCE_URI_REMOTE</text>
    <text x="40" y="182" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="500" font-size="10.5" fill="#6B7580">--online</text>

    <rect x="24" y="210" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#D7DBDD" stroke-width="1.5"/>
    <text x="40" y="234" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="600" font-size="12" fill="#1C2327">SOURCE_URI_LOCAL</text>
    <text x="40" y="252" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="500" font-size="10.5" fill="#6B7580">--offline (default)</text>

    <path d="M224,168 L246,203" stroke="#0F766E" stroke-width="1.75" fill="none"/>
    <path d="M224,238 L246,203" stroke="#0F766E" stroke-width="1.75" fill="none"/>
    <path d="M246,203 L295,205" stroke="#0F766E" stroke-width="2" fill="none" marker-end="url(#arrow-flow)"/>
    <text x="248" y="196" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="600" font-size="10.5" fill="#6B7580">fsspec</text>

    <!-- ============ BRONZE ============ -->
    <rect x="300" y="120" width="210" height="170" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.75"/>
    <text x="316" y="144" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#1C2327">BRONZE</text>
    <text x="316" y="164" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="600" font-size="12" fill="#1C2327">TARGET_URI/bronze</text>
    <text x="316" y="188" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C444A">verbatim + lineage</text>
    <text x="316" y="206" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C444A">partitioned by participant</text>
    <text x="316" y="228" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C444A">_source_uri · _ingested_at</text>
    <text x="316" y="244" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C444A">· _run_id</text>

    <path d="M510,205 L605,205" stroke="#0F766E" stroke-width="2" fill="none" marker-end="url(#arrow-flow)"/>
    <text x="525" y="195" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="600" font-size="10.5" fill="#6B7580">6 rules</text>

    <!-- ============ SILVER ============ -->
    <rect x="610" y="90" width="230" height="230" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.75"/>
    <text x="626" y="114" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#1C2327">SILVER</text>
    <text x="626" y="134" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="600" font-size="12" fill="#1C2327">TARGET_URI/silver</text>
    <text x="626" y="158" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C444A">21 rules (eda/findings.md)</text>
    <text x="626" y="178" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C444A">typed · deduped · rescaled</text>
    <text x="626" y="198" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C444A">rejects quarantined, not dropped</text>
    <text x="626" y="218" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C444A">participant-day coverage grid</text>
    <text x="626" y="236" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C444A">— the honest completeness check</text>

    <path d="M700,320 L722,347" stroke="#B91C1C" stroke-width="1.75" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-quarantine)"/>
    <text x="558" y="332" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="600" font-size="10.5" fill="#B91C1C">reject_reason</text>

    <!-- ============ QUARANTINE ============ -->
    <rect x="640" y="350" width="170" height="90" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="654" y="374" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#B91C1C">QUARANTINE</text>
    <text x="654" y="393" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="600" font-size="12" fill="#1C2327">…/_quarantine</text>
    <text x="654" y="412" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C444A">rejected sleep sessions</text>
    <text x="654" y="428" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C444A">orphan survey rows</text>

    <path d="M840,205 L935,205" stroke="#0F766E" stroke-width="2" fill="none" marker-end="url(#arrow-flow)"/>
    <text x="846" y="195" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="600" font-size="10.5" fill="#6B7580">DuckDB SQL</text>

    <!-- ============ GOLD ============ -->
    <rect x="940" y="60" width="300" height="290" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.75"/>
    <text x="956" y="84" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#1C2327">GOLD</text>
    <text x="956" y="104" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="600" font-size="12" fill="#1C2327">TARGET_URI/gold</text>
    <text x="956" y="122" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="500" font-size="10.5" fill="#6B7580">4 tables, chained as SQL views</text>
    <text x="956" y="150" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="600" font-size="11.5" fill="#1C2327">▸ gold_participant_devices</text>
    <text x="956" y="180" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="600" font-size="11.5" fill="#1C2327">▸ gold_daily_participant_metrics</text>
    <text x="956" y="210" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="600" font-size="11.5" fill="#1C2327">▸ gold_weekly_participant_summary</text>
    <text x="956" y="240" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="600" font-size="11.5" fill="#1C2327">▸ gold_chronotype_cohort_metrics</text>
    <text x="956" y="266" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C444A">+ analytics: cohort effect sizes</text>
    <text x="956" y="282" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C444A">(Welch t, Cohen's d) → outputs/</text>

    <path d="M1240,205 L1315,115" stroke="#0F766E" stroke-width="2" fill="none" marker-end="url(#arrow-flow)"/>
    <path d="M1240,205 L1315,295" stroke="#0F766E" stroke-width="2" fill="none" marker-end="url(#arrow-flow)"/>
    <text x="1248" y="145" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="600" font-size="10.5" fill="#6B7580">daily</text>
    <text x="1248" y="275" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="600" font-size="10.5" fill="#6B7580">weekly</text>

    <!-- ============ CONSUMERS ============ -->
    <rect x="1320" y="60" width="230" height="110" rx="10" fill="#FFFFFF" stroke="#D7DBDD" stroke-width="1.5"/>
    <text x="1336" y="84" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#1C2327">DAILY · CLINICAL</text>
    <text x="1336" y="104" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="500" font-size="10.5" fill="#6B7580">+ daily_participant_metrics</text>
    <text x="1336" y="120" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="500" font-size="10.5" fill="#6B7580">+ participant_devices</text>
    <text x="1336" y="142" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C444A">per participant, per day</text>

    <rect x="1320" y="240" width="230" height="110" rx="10" fill="#FFFFFF" stroke="#D7DBDD" stroke-width="1.5"/>
    <text x="1336" y="264" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#1C2327">WEEKLY · BIOSTATS</text>
    <text x="1336" y="284" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="500" font-size="10.5" fill="#6B7580">+ weekly_participant_summary</text>
    <text x="1336" y="300" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="500" font-size="10.5" fill="#6B7580">+ chronotype_cohort_metrics</text>
    <text x="1336" y="322" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C444A">cohort t-test, Cohen's d</text>

    <!-- ============ DATA QUALITY SIDE CHANNEL ============ -->
    <path d="M405,290 L620,478" stroke="#6B7580" stroke-width="1.5" stroke-dasharray="2 5" fill="none" stroke-linecap="round" marker-end="url(#arrow-dq)"/>
    <path d="M790,320 L790,478" stroke="#6B7580" stroke-width="1.5" stroke-dasharray="2 5" fill="none" stroke-linecap="round" marker-end="url(#arrow-dq)"/>
    <path d="M1060,350 L920,478" stroke="#6B7580" stroke-width="1.5" stroke-dasharray="2 5" fill="none" stroke-linecap="round" marker-end="url(#arrow-dq)"/>
    <text x="770" y="466" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="600" font-size="10.5" fill="#6B7580" text-anchor="middle">every stage emits Check rows</text>

    <rect x="560" y="480" width="420" height="110" rx="10" fill="#FFFFFF" stroke="#6B7580" stroke-width="1.5" stroke-dasharray="2 4"/>
    <text x="576" y="504" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#6B7580">DATA QUALITY</text>
    <text x="576" y="524" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-weight="600" font-size="12" fill="#1C2327">TARGET_URI/_dq/dq_checks.csv</text>
    <text x="576" y="546" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C444A">Check(table, rule, severity, n_affected)</text>
    <text x="576" y="566" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#3C444A">run_report.md · --strict fails the run</text>
  </g>
</svg>
